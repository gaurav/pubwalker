[project]
name = "pubwalker"
version = "0.1.0"
description = "Report how a paper is cited and what it argues, from OpenAlex, Semantic Scholar, Europe PMC and Claude."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "python-dotenv>=1.0"]

[project.scripts]
pubwalker = "pubwalker.cli:main"
serve = "pubwalker.cli:serve"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pubwalker"]

[dependency-groups]
dev = [
    "livereload>=2.7.1",
]
